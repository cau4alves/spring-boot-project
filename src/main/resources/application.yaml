server:
  port: 8081

spring:
  application:
    name: spring-boot-project-2

  datasource:
    url: jdbc:mysql://localhost:3306/boot?createDatabaseIfNotExist=true
    username: ${DATABASE_URL}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true